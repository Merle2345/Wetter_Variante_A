<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Glass Pro</title>

    <link rel="stylesheet" href="style.css">
</head>
<body class="sunny">

    <!-- Wettereffekte -->
    <div id="weatherEffects"></div>

    <!-- Hauptcontainer -->
    <div class="card">

        <h1>🌤 Wetter-App</h1>

        <!-- Suche -->
        <div class="search">
            <input
                type="text"
                id="cityInput"
                placeholder="Stadt eingeben..."
                value="Hamburg">

            <button onclick="searchCity()">
                Suchen
            </button>
        </div>

        <!-- Aktuelles Wetter -->
        <div class="current-weather">

            <div id="city" class="city">
                Hamburg
            </div>

            <div id="emoji" class="emoji">
                ⏳
            </div>

            <div id="temp" class="temp">
                --°C
            </div>

        </div>

        <!-- Wetterdetails -->
        <div class="info">

            <div class="box">
                <h3>💨 Wind</h3>
                <p id="wind">-- km/h</p>
            </div>

            <div class="box">
                <h3>💧 Luftfeuchtigkeit</h3>
                <p id="humidity">-- %</p>
            </div>

            <div class="box">
                <h3>🌅 Sonnenaufgang</h3>
                <p id="sunrise">--:--</p>
            </div>

            <div class="box">
                <h3>🌇 Sonnenuntergang</h3>
                <p id="sunset">--:--</p>
            </div>

        </div>

        <!-- Vorhersage -->
        <h2 class="forecast-title">
            5-Tage-Vorhersage
        </h2>

        <div id="forecast" class="forecast">

            <!-- Wird per JavaScript gefüllt -->

        </div>

        <!-- Aktualisierung -->
        <div id="update" class="update">
            Lade Wetterdaten...
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
